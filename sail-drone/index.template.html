<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sail drone</title>
<style>
  :root { --fg:#1f2328; --mut:#6b7280; --line:rgba(15,23,42,.10); --chip:rgba(255,255,255,.82);
          --acc:#00ae42; --accd:#00933a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; color:var(--fg);
               font:12.5px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
               background: linear-gradient(180deg, #eef0f3 0%, #f8f9fb 60%, #eceef1 100%); }
  #mount { position:fixed; inset:0; }
  #mount canvas { display:block; width:100%; height:100%; touch-action:none; outline:none; }
  button { font:inherit; color:inherit; }

  /* view buttons */
  #views { position:fixed; right:8px; top:42px; display:flex; flex-direction:column; gap:4px; }
  #views button { width:38px; padding:4px 0; border:1px solid var(--line); background:var(--chip); border-radius:7px;
                  cursor:pointer; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:var(--mut); font-size:11px; }
  #views button:hover { color:var(--fg); background:#fff; }

  /* side panel: object list (Prepare) or feature legend (Preview) */
  #side { position:fixed; left:8px; top:42px; max-height:calc(100% - 120px); overflow:auto; min-width:150px; max-width:220px;
          background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:4px;
          backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  #side.hide { display:none; }
  .row { display:flex; align-items:center; gap:6px; padding:3px 6px; border-radius:6px; cursor:pointer; white-space:nowrap; }
  .row:hover { background:rgba(0,0,0,.05); }
  .row.sel { background:rgba(0,174,66,.13); }
  .row.off { opacity:.38; }
  .row .sw { width:10px; height:10px; border-radius:3px; flex:0 0 auto; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15); }
  .row .nm { overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; }
  .row .r { color:var(--mut); font-variant-numeric:tabular-nums; }
  #sideHead { display:flex; justify-content:space-between; color:var(--mut); padding:2px 6px 3px; font-size:11px; }
  #sideHead button { border:0; background:none; color:var(--mut); cursor:pointer; padding:0 2px; }
  #sideTab { position:fixed; left:8px; top:42px; }
  #sideTab.hide { display:none; }

  #tip { position:fixed; pointer-events:none; background:rgba(17,24,39,.88); color:#fff; padding:3px 7px; border-radius:6px;
         font-size:11.5px; display:none; white-space:nowrap; transform:translate(10px, -26px); }
  #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--mut);
            pointer-events:none; text-align:center; padding:20px; }
  #status.err { color:#b42318; }
  #status .box { background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:8px 14px; }
  @media (max-width:560px) {
    .chip.name { max-width:38vw; }
    #side { max-width:170px; max-height:calc(100% - 150px); }
  }
  /* boat page additions: chip-sized tap label, system headings in the list, wrapped Reset parts */
  html, body { -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  #views button.wrap { line-height:1.15; padding:4px 1px; }
  #tip.lab { white-space:normal; max-width:240px; font-size:12px; padding:5px 9px; transform:translate(-50%, calc(-100% - 16px)); }
  #tip.lab b { display:block; font-weight:600; } #tip.lab small { display:block; opacity:.75; font-size:11px; margin-top:1px; }
  .grp { color:var(--mut); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:6px 6px 2px; }
  #sideTab { top:8px; } #side { top:8px; max-height:calc(100% - 16px); } #views { top:8px; }
</style>
<!--IMPORTMAP-->
</head><body>
<div id="mount"></div>
<div id="views">
  <button data-v="iso" title="Isometric (0)">Iso</button>
  <button data-v="top" title="Top (1)">Top</button>
  <button data-v="side" title="Side (3)">Side</button>
  <button data-v="fit" title="Fit (F)">Fit</button>
  <button id="resetParts" class="wrap" title="Put every moved part back">Reset parts</button>
</div>
<div id="sideTab"><button class="chip" id="sideOpen">List</button></div>
<div id="side" class="hide"><div id="sideHead"><span id="sideTitle">Parts</span><button id="sideClose" title="Hide">✕</button></div><div id="sideBody"></div></div>
<div id="tip"></div>
<div id="status"><div class="box">Loading boat…</div></div>
<!--CONFIG-->
<!--VIEWER-->
</body></html>
